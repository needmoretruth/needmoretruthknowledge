[workspace]
resolver = "3"
members = ["crates/*"]
# Being rewritten to the conversational KQ standard. They come back the moment they compile
# against it; shipping a quest that still lectures at the reader is worse than shipping three.


[workspace.package]
# nmtk starts at 0.0.1 and moves only when something is pushed.
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/needmoretruth/needmoretruthknowledge"
description = "Run proof of work, ledger models, transformers and zero-knowledge proofs on your own machine, and change them while they run."

[workspace.dependencies]
nmtk-core = { path = "crates/nmtk-core" }
nmtk-i18n = { path = "crates/nmtk-i18n" }
nmtk-kq = { path = "crates/nmtk-kq" }
nmtk-pow = { path = "crates/nmtk-pow" }
nmtk-ledger = { path = "crates/nmtk-ledger" }
nmtk-transformer = { path = "crates/nmtk-transformer" }
nmtk-zk = { path = "crates/nmtk-zk" }
nmtk-tui = { path = "crates/nmtk-tui" }
kq-ledgers = { path = "crates/kq-ledgers" }
kq-proof-of-work = { path = "crates/kq-proof-of-work" }
kq-transformer = { path = "crates/kq-transformer" }
kq-zero-knowledge = { path = "crates/kq-zero-knowledge" }
ratatui = "0.30.2"
crossterm = "0.29.0"
sha2 = "0.11.0"
rand = "0.10.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"
halo2_proofs = "0.3.5"
ff = "0.14.0"
group = "0.14.0"
pasta_curves = "0.5.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
